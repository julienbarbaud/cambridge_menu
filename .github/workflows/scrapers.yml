name: Daily scrapers

on:
  schedule:
    # Runs at 00:00 UTC and 12:00 UTC every day (twice a day)
    - cron: '0 0,12 * * *'
  #allowing manual trigger for testing  
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scraper/requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run main.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python scraper/main.py
